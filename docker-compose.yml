version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Flask Agents API
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql://agentops:agentops_password@postgres:5432/agentops
      - DASHBOARD_URL=http://dashboard:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./agents:/app
      - agent_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://agentops:agentops_password@postgres:5432/agentops
      - AGENTS_API_URL=http://agents:5000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Logger Server
  logger-mcp:
    build:
      context: ./logger-mcp
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DASHBOARD_URL=http://dashboard:3000
    volumes:
      - ./logger-mcp:/app
      - mcp_logs:/app/logs

volumes:
  postgres_data:
  agent_logs:
  mcp_logs:
