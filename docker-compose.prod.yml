# Production override for docker-compose.yml
# Use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.8"

services:
  agents:
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false

  dashboard:
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  logger-mcp:
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
